name: Publicar actualización Android

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verificar que el tag pertenece a main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar y validar
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx cap sync android

      - name: Recuperar y validar la clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!variable:-}" || { echo "Falta el secret $variable" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks
          keytool -list \
            -keystore android/release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Compilar APK firmado
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FEEDBACK_RELAY_URL: ${{ secrets.FEEDBACK_RELAY_URL }}
          FEEDBACK_RELAY_KEY: ${{ secrets.FEEDBACK_RELAY_KEY }}
        run: |
          test -n "$FEEDBACK_RELAY_URL"
          test -n "$FEEDBACK_RELAY_KEY"
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$VERSION_CODE" \
            -PfeedbackRelayUrl="$FEEDBACK_RELAY_URL" \
            -PfeedbackRelayKey="$FEEDBACK_RELAY_KEY"
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "Pablo-Tablet-${VERSION_NAME}.apk"
          sha256sum "Pablo-Tablet-${VERSION_NAME}.apk" > "Pablo-Tablet-${VERSION_NAME}.apk.sha256"

      - name: Verificar identidad y firma del APK
        run: |
          set -euo pipefail
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          node scripts/verify-android-release.mjs \
            --apk "Pablo-Tablet-${VERSION_NAME}.apk" \
            --expected-package "com.pablohorcajada.tablet" \
            --expected-version "$VERSION_NAME" \
            --expected-certificate-sha256 "7a706549c89f27d3560fad8ffb7127d395c3830d18f403463d65d9e2fb6af346" \
            --minimum-version-code "1003" \
            --output "Pablo-Tablet-${VERSION_NAME}.apk.metadata.txt"
          sha256sum --check "Pablo-Tablet-${VERSION_NAME}.apk.sha256"

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            "Pablo-Tablet-${VERSION_NAME}.apk" \
            "Pablo-Tablet-${VERSION_NAME}.apk.sha256" \
            "Pablo-Tablet-${VERSION_NAME}.apk.metadata.txt" \
            --verify-tag \
            --generate-notes \
            --title "Pablo Tablet ${VERSION_NAME}"

      - name: Eliminar la clave temporal
        if: always()
        run: rm -f android/release-key.jks

  update-issues:
    name: Actualizar incidencias publicadas
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Marcar incidencias publicadas como implementadas
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo
            const associatedPulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: context.sha },
            )
            const publicationPull = associatedPulls.find((pull) =>
              pull.merged_at &&
              pull.base.ref === 'main' &&
              (pull.head.ref.startsWith('release/') || pull.head.ref.startsWith('hotfix/'))
            )
            if (!publicationPull) {
              core.setFailed('El tag no está asociado a un pull request fusionado de release/* o hotfix/* hacia main.')
              return
            }

            const section = publicationPull.body?.match(/##\s+Incidencias incluidas\s*([\s\S]*?)(?=\n##\s|$)/i)?.[1] ?? ''
            const issueNumbers = [...new Set(
              [...section.matchAll(/#(\d+)/g)].map((match) => Number(match[1])),
            )]
            if (issueNumbers.length === 0) {
              core.setFailed('El pull request de publicación no enumera incidencias bajo "Incidencias incluidas".')
              return
            }

            for (const issue_number of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number })
              const labels = issue.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean)
              if (labels.includes('instalado')) {
                core.info(`#${issue_number} ya está instalado; se conserva ese estado.`)
                continue
              }
              for (const name of ['visto', 'en-desarrollo']) {
                if (!labels.includes(name)) continue
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name })
              }
              if (!labels.includes('implementado')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['implementado'] })
              }
              if (labels.includes('feedback-movil')) {
                await github.rest.issues.update({ owner, repo, issue_number, state: 'closed', state_reason: 'completed' })
              }
              core.info(`#${issue_number} publicado y marcado como implementado.`)
            }
