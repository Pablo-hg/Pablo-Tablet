name: Convertir feedback a Markdown

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  generate:
    if: github.event.label.name == 'implementado' && contains(github.event.issue.labels.*.name, 'feedback-movil')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: Generar archivo Markdown
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const issue = context.payload.issue
            const directory = path.join(process.env.GITHUB_WORKSPACE, 'feedback')
            fs.mkdirSync(directory, { recursive: true })
            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name).filter(Boolean)
            const status = labels.includes('implementado')
              ? 'implementado'
              : labels.includes('en-desarrollo')
                ? 'en desarrollo'
                : labels.includes('visto')
                  ? 'visto'
                  : 'enviado'
            const content = [
              `# ${issue.title}`,
              '',
              `- Issue: [#${issue.number}](${issue.html_url})`,
              `- Estado: ${status}`,
              `- Etiquetas: ${labels.join(', ') || 'ninguna'}`,
              `- Creado: ${issue.created_at}`,
              `- Actualizado: ${issue.updated_at}`,
              '',
              issue.body || '_Sin descripción._',
              '',
            ].join('\n')
            fs.writeFileSync(path.join(directory, `issue-${issue.number}.md`), content, 'utf8')
      - name: Proponer el cambio en dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="automation/feedback-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add feedback
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(feedback): actualizar issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"
          BODY=$(printf 'Actualiza el Markdown interno después de marcar la incidencia como implementada.\n\nRefs #%s\n' '${{ github.event.issue.number }}')
          gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "docs(feedback): actualizar issue #${{ github.event.issue.number }}" \
            --body "$BODY"
