name: Validar pull request

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar el recorrido de la rama
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = "main" ]; then
            case "$HEAD_BRANCH" in
              dev|hotfix/*) ;;
              *) echo "main solo acepta PR desde dev o hotfix/*."; exit 1 ;;
            esac
          fi
          if [ "$BASE_BRANCH" = "dev" ]; then
            case "$HEAD_BRANCH" in
              feature/*|fix/*|hotfix/*|automation/*|main) ;;
              *) echo "dev solo acepta PR desde feature/*, fix/*, hotfix/*, automation/* o main."; exit 1 ;;
            esac
          fi

      - name: Verificar las incidencias de la publicación
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? ''
            const section = body.match(/##\s+Incidencias incluidas\s*([\s\S]*?)(?=\n##\s|$)/i)?.[1] ?? ''
            if (!/#\d+/.test(section)) {
              core.setFailed('El PR hacia main debe enumerar al menos un Issue bajo "Incidencias incluidas".')
            }

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar la aplicación web
        run: npm run build

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Compilar APK de validación
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
