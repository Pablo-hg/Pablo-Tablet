apply plugin: 'com.android.application'

def releaseKeystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def configuredVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def configuredVersionName = project.findProperty('appVersionName')?.toString()
if (!configuredVersionName || !(configuredVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('Falta appVersionName=X.Y.Z en android/gradle.properties o como -PappVersionName.')
}
def configuredFeedbackRelayUrl = (project.findProperty('feedbackRelayUrl') ?: '').toString().replace('\\', '\\\\').replace('"', '\\"')
def configuredFeedbackRelayKey = (project.findProperty('feedbackRelayKey') ?: '').toString().replace('\\', '\\\\').replace('"', '\\"')

android {
    namespace = "com.pablohorcajada.tablet"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "com.pablohorcajada.tablet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode
        versionName configuredVersionName
        buildConfigField "String", "FEEDBACK_RELAY_URL", "\"${configuredFeedbackRelayUrl}\""
        buildConfigField "String", "FEEDBACK_RELAY_KEY", "\"${configuredFeedbackRelayKey}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // APK experimental paralelo: firma debug de Android, datos y paquete aislados.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-exports=java.base/jdk.internal.access=ALL-UNNAMED'
            // Los tests ejercitan el comportamiento de producción; ver DevVariant.java.
            systemProperty 'pablo.dev.lockdown', 'false'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Protección contra instalaciones accidentales sobre la app estable.
// Las instalaciones se hacen con scripts/android-dev (adb install -r de un APK verificado).
// Gradle solo permite install* de debug y con -PpabloDevInstall=true; installRelease queda prohibido.
afterEvaluate {
    def debugId = android.buildTypes.debug.applicationIdSuffix
    if (debugId != ".debug") {
        throw new GradleException("buildTypes.debug debe conservar applicationIdSuffix \".debug\" para no pisar la app estable.")
    }
}
gradle.taskGraph.whenReady { graph ->
    graph.allTasks.findAll { it.name ==~ /install.*/ }.each { task ->
        if (task.name != "installDebug") {
            throw new GradleException("Tarea ${task.path} bloqueada: no se instalan APK de producción desde Gradle.")
        }
        if (!project.hasProperty("pabloDevInstall")) {
            throw new GradleException("installDebug bloqueado. Usa npm run android:dev:install -- --yes (comprueba variante y destino).")
        }
    }
}
